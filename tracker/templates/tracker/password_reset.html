{% extends 'tracker/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0;">Reset Password</h2>
    <p style="color: #6b7280; font-size: 14px;">Enter your email address and we will send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
        <button type="submit" style="width: 100%; background: #0079bf; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
