{% extends 'tracker/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px;">
    <h2>Enter New Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; background: #22c55e; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold;">Set New Password</button>
    </form>
</div>
{% endblock %}
