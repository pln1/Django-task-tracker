{% extends 'tracker/base.html' %}

{% block title %}Create Board - BjFlow{% endblock %}

{% block content %}
    <a href="/boards/" style="text-decoration: none; color: #007bff; margin-bottom: 20px; display: inline-block;">← Back to boards</a>
    
    <div style="max-width: 500px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #edf2f7;">
        <h2 style="margin-top: 0; color: #1a202c;">Create a new board</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #4a5568;">Board Name:</label>
                <input type="text" name="board_name" class="form-control" placeholder="e.g., Q3 Marketing Goals" required>
            </div>
            
            <button type="submit" class="btn-submit" style="background-color: #28a745;">
                Create Board
            </button>
        </form>
    </div>
{% endblock %}
