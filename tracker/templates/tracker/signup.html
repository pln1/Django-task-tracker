{% extends 'tracker/base.html' %}

{% block title %}Sign Up - BjFlow{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; margin-bottom: 30px; font-size: 28px; color: #1a202c;">Create Account</h2>
    
    {% if error %}
        <div style="background-color: #fff5f5; color: #c53030; padding: 12px; margin-bottom: 20px; border: 1px solid #feb2b2; border-radius: 6px; font-size: 14px;">
            <strong>Registration failed!</strong> {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #4a5568;">Username</label>
        <input type="text" name="username" class="form-control" required>

        <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #4a5568;">Email Address</label>
        <input type="email" name="email" class="form-control" required>
        
        <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #4a5568;">Password</label>
        <input type="password" name="password" class="form-control" required>
        
        <button type="submit" class="btn-submit" style="margin-top: 10px; background-color: #28a745;">Sign Up</button>
    </form>
    
    <p style="text-align: center; margin-top: 25px; color: #718096; font-size: 14px;">
        Already have an account? <a href="/login/" style="color: #007bff; text-decoration: none; font-weight: bold;">Log in</a>
    </p>
</div>
{% endblock %}
